document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: \u0027DM Sans\u0027;\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f166097c-1c87-40db-9d8f-271af915e016\") format(\u0027woff2\u0027);\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: \u0027DM Sans\u0027;\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ee2eb482-a81a-4a82-9ba6-61975476f8bd\") format(\u0027woff2\u0027);\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: \u0027DM Serif Display\u0027;\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b1be33d9-fa0e-4828-9ca0-738156fa0a84\") format(\u0027woff2\u0027);\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: \u0027DM Serif Display\u0027;\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1ab9865e-9399-44fa-82b2-ea7412d40f10\") format(\u0027woff2\u0027);\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: \u0027DM Serif Display\u0027;\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"a8a87aaf-c33a-4c9f-91cc-2ffb075770e0\") format(\u0027woff2\u0027);\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: \u0027DM Serif Display\u0027;\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ea259917-2a9d-4235-8de8-a62e6a691fc3\") format(\u0027woff2\u0027);\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\u003c/style\u003e\n\n\u003c!-- Bundler splash thumbnail --\u003e\n\n\n\u003cstyle\u003e\n/* ─────────────────────────────────────────────────────────────\n   1. DESIGN TOKENS\n   ───────────────────────────────────────────────────────────── */\n:root {\n  --bg:       #F6F5F0;   /* paper canvas */\n  --bg-2:     #EFEDE5;   /* slightly deeper paper */\n  --ink:      #0D0D0D;   /* primary text */\n  --ink-60:   rgba(13, 13, 13, 0.62);\n  --ink-40:   rgba(13, 13, 13, 0.40);\n  --ink-12:   rgba(13, 13, 13, 0.12);\n  --ink-08:   rgba(13, 13, 13, 0.08);\n  --pink:     #FCACF5;   /* accent 1 */\n  --yellow:   #F8EA65;   /* accent 2 */\n  --dot:      rgba(13, 13, 13, 0.07);\n\n  --serif: \"DM Serif Display\", \"Times New Roman\", serif;\n  --sans:  \"DM Sans\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", system-ui, sans-serif;\n\n  --ease:    cubic-bezier(0.22, 1, 0.36, 1);\n  --ease-2:  cubic-bezier(0.6, 0.05, 0.2, 1);\n\n  --radius-sm: 12px;\n  --radius:    20px;\n  --radius-lg: 28px;\n\n  --maxw: 1280px;\n  --pad-x: clamp(20px, 5vw, 64px);\n}\n\n/* ─────────────────────────────────────────────────────────────\n   2. RESET / BASE\n   ───────────────────────────────────────────────────────────── */\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { scroll-behavior: smooth; }\n\nbody {\n  font-family: var(--sans);\n  font-weight: 400;\n  color: var(--ink);\n  background: var(--bg);\n  line-height: 1.6;\n  font-size: 16px;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  overflow-x: hidden;\n  min-height: 100vh;\n\n  /* Subtle dot-matrix paper texture overlay */\n  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);\n  background-size: 22px 22px;\n  background-position: 0 0;\n}\n\nimg { max-width: 100%; display: block; }\na   { color: inherit; text-decoration: none; }\nbutton, input, textarea, select { font: inherit; color: inherit; }\nbutton { background: none; border: none; cursor: pointer; }\n\n::selection { background: var(--pink); color: var(--ink); }\n\nh1, h2, h3, h4 {\n  font-family: var(--serif);\n  font-weight: 400;\n  line-height: 1.15;\n  letter-spacing: -0.01em;\n}\n\n/* ─────────────────────────────────────────────────────────────\n   3. LAYOUT HELPERS\n   ───────────────────────────────────────────────────────────── */\n.container {\n  max-width: var(--maxw);\n  margin: 0 auto;\n  padding-inline: var(--pad-x);\n}\n\n.eyebrow {\n  font-family: var(--sans);\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--ink-60);\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n}\n.eyebrow::before {\n  content: \"\";\n  width: 6px; height: 6px;\n  border-radius: 50%;\n  background: var(--ink);\n}\n\n/* ─────────────────────────────────────────────────────────────\n   4. FLOATING HEADER / NAV\n   ───────────────────────────────────────────────────────────── */\n.header {\n  position: fixed;\n  top: 20px;\n  left: 0; right: 0;\n  z-index: 100;\n  display: flex;\n  justify-content: center;\n  padding-inline: var(--pad-x);\n  pointer-events: none;\n}\n\n.header-pill {\n  pointer-events: auto;\n  background: rgba(246, 245, 240, 0.85);\n  backdrop-filter: blur(16px) saturate(140%);\n  -webkit-backdrop-filter: blur(16px) saturate(140%);\n  border: 1px solid var(--ink-08);\n  border-radius: 999px;\n  padding: 8px 8px 8px 24px;\n  display: flex;\n  align-items: center;\n  gap: 28px;\n  box-shadow: 0 8px 30px -10px rgba(13, 13, 13, 0.08);\n  max-width: 100%;\n}\n\n.brand {\n  font-family: var(--serif);\n  font-size: 18px;\n  letter-spacing: -0.01em;\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  white-space: nowrap;\n}\n@keyframes dotCycle {\n  0%, 100% { background: var(--ink); }\n  33%       { background: var(--pink); }\n  66%       { background: var(--yellow); }\n}\n.brand-dot {\n  width: 10px; height: 10px;\n  border-radius: 50%;\n  background: var(--pink);\n  display: inline-block;\n  animation: dotCycle 2.4s ease-in-out infinite;\n}\n.brand:hover .brand-dot { animation-play-state: paused; background: var(--yellow); }\n\n.nav {\n  display: flex;\n  align-items: center;\n  gap: 4px;\n}\n\n.nav-link {\n  font-size: 14px;\n  font-weight: 500;\n  padding: 10px 16px;\n  border-radius: 999px;\n  color: var(--ink-60);\n  position: relative;\n  transition: color 0.4s var(--ease), background 0.4s var(--ease);\n  white-space: nowrap;\n}\n.nav-link:hover { color: var(--ink); background: var(--ink-08); }\n.nav-link.is-active {\n  color: var(--ink);\n  background: var(--ink);\n  color: var(--bg);\n}\n\n.nav-cta {\n  font-size: 14px;\n  font-weight: 500;\n  padding: 10px 18px;\n  border-radius: 999px;\n  background: var(--pink);\n  color: var(--ink);\n  transition: background 0.4s var(--ease), color 0.4s var(--ease), transform 0.4s var(--ease);\n}\n.nav-cta:hover { background: var(--ink); color: var(--bg); transform: translateY(-1px); }\n\n.mobile-toggle {\n  display: none;\n  width: 40px; height: 40px;\n  border-radius: 50%;\n  background: var(--ink);\n  color: var(--bg);\n  align-items: center;\n  justify-content: center;\n}\n.mobile-toggle svg { width: 18px; height: 18px; }\n\n/* Mobile nav drawer */\n.mobile-drawer {\n  position: fixed;\n  inset: 0;\n  background: var(--bg);\n  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);\n  background-size: 22px 22px;\n  z-index: 99;\n  display: flex;\n  flex-direction: column;\n  padding: 100px var(--pad-x) 40px;\n  opacity: 0;\n  pointer-events: none;\n  transform: translateY(-12px);\n  transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);\n}\n.mobile-drawer.is-open {\n  opacity: 1;\n  pointer-events: auto;\n  transform: translateY(0);\n}\n.mobile-drawer .nav-link {\n  font-family: var(--serif);\n  font-size: 44px;\n  padding: 18px 0;\n  border-radius: 0;\n  border-bottom: 1px solid var(--ink-12);\n  color: var(--ink);\n}\n.mobile-drawer .nav-link.is-active { background: transparent; color: var(--ink); }\n.mobile-drawer .nav-link.is-active::after {\n  content: \" →\";\n  color: var(--pink);\n}\n\n/* ─────────────────────────────────────────────────────────────\n   5. PAGE TRANSITIONS\n   ───────────────────────────────────────────────────────────── */\nmain { padding-top: 120px; }\n\n.page {\n  display: none;\n  opacity: 0;\n  transform: translateY(24px);\n}\n.page.is-active {\n  display: block;\n  animation: pageIn 0.7s var(--ease) forwards;\n}\n@keyframes pageIn {\n  from { opacity: 0; transform: translateY(24px); }\n  to   { opacity: 1; transform: translateY(0); }\n}\n\n/* Stagger reveal for inner blocks */\n.page.is-active [data-reveal] {\n  opacity: 0;\n  transform: translateY(20px);\n  animation: revealIn 0.9s var(--ease) forwards;\n  animation-delay: calc(var(--i, 0) * 90ms + 120ms);\n}\n@keyframes revealIn {\n  to { opacity: 1; transform: translateY(0); }\n}\n\n/* ─────────────────────────────────────────────────────────────\n   6. BUTTONS (shared)\n   ───────────────────────────────────────────────────────────── */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 12px;\n  padding: 16px 26px;\n  border-radius: 999px;\n  font-size: 15px;\n  font-weight: 500;\n  transition: background 0.5s var(--ease), color 0.5s var(--ease),\n              transform 0.5s var(--ease), border-color 0.5s var(--ease);\n  border: 1px solid transparent;\n  white-space: nowrap;\n}\n.btn .arrow {\n  width: 22px; height: 22px;\n  border-radius: 50%;\n  background: currentColor;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  transition: transform 0.5s var(--ease);\n}\n.btn .arrow svg { width: 12px; height: 12px; }\n.btn:hover .arrow { transform: rotate(-45deg); }\n\n.btn-primary {\n  background: var(--pink);\n  color: var(--ink);\n  border-color: var(--pink);\n}\n.btn-primary .arrow { background: var(--ink); }\n.btn-primary .arrow svg { color: var(--pink); }\n.btn-primary:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }\n.btn-primary:hover .arrow { background: var(--bg); }\n.btn-primary:hover .arrow svg { color: var(--ink); }\n\n.btn-ghost {\n  background: transparent;\n  color: var(--ink);\n  border-color: var(--ink-12);\n}\n.btn-ghost .arrow { background: var(--ink); }\n.btn-ghost .arrow svg { color: var(--bg); }\n.btn-ghost:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }\n.btn-ghost:hover .arrow { background: var(--bg); }\n.btn-ghost:hover .arrow svg { color: var(--ink); }\n\n/* ─────────────────────────────────────────────────────────────\n   7. HOME — HERO\n   ───────────────────────────────────────────────────────────── */\n.hero {\n  padding: 80px 0 100px;\n  display: flex;\n  justify-content: center;\n  text-align: center;\n}\n\n.hero-text { max-width: 960px; width: 100%; }\n\n.hero h1 {\n  font-size: clamp(48px, 7.4vw, 108px);\n  line-height: 1.02;\n  letter-spacing: -0.025em;\n  margin-top: 0;\n  font-weight: 400;\n}\n.hero h1 .accent-pink  { color: var(--ink); position: relative; display: inline-block; padding: 0 6px; }\n@keyframes nameColorCycle {\n  0%, 100% { background: var(--pink); }\n  33%       { background: var(--yellow); }\n  66%       { background: #ffffff; }\n}\n.hero h1 .accent-pink::before {\n  content: \"\";\n  position: absolute;\n  inset: 12% -2px 10% -2px;\n  background: var(--pink);\n  z-index: -1;\n  border-radius: 6px;\n  animation: nameColorCycle 3s ease-in-out infinite;\n}\n.hero h1 em {\n  font-style: italic;\n  color: var(--ink-60);\n}\n\n.hero-sub {\n  margin-top: 28px;\n  max-width: 560px;\n  font-size: 17px;\n  color: var(--ink-60);\n}\n\n.hero-actions {\n  margin-top: 40px;\n  display: flex;\n  flex-wrap: wrap;\n  gap: 12px;\n  justify-content: center;\n}\n\n/* Hero visual — organic shapes placeholder */\n.hero-visual {\n  position: relative;\n  aspect-ratio: 4 / 5;\n  border-radius: var(--radius-lg);\n  background: var(--bg-2);\n  border: 1px solid var(--ink-08);\n  overflow: hidden;\n}\n.hero-visual::before,\n.hero-visual::after {\n  content: \"\";\n  position: absolute;\n  border-radius: 50%;\n}\n.hero-visual::before {\n  width: 70%; aspect-ratio: 1;\n  background: var(--pink);\n  top: 18%; left: -20%;\n  animation: float 12s var(--ease-2) infinite alternate;\n}\n.hero-visual::after {\n  width: 55%; aspect-ratio: 1;\n  background: var(--yellow);\n  bottom: -18%; right: -10%;\n  animation: float 14s var(--ease-2) infinite alternate-reverse;\n}\n.hero-visual .v-label {\n  position: absolute;\n  bottom: 20px; left: 20px;\n  z-index: 2;\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--ink);\n  background: rgba(246, 245, 240, 0.85);\n  backdrop-filter: blur(8px);\n  padding: 8px 12px;\n  border-radius: 999px;\n}\n.hero-visual .v-num {\n  position: absolute;\n  top: 22px; right: 22px;\n  z-index: 2;\n  font-family: var(--serif);\n  font-style: italic;\n  font-size: 28px;\n  color: var(--ink);\n}\n\n@keyframes float {\n  from { transform: translate(0, 0) scale(1); }\n  to   { transform: translate(8%, -6%) scale(1.06); }\n}\n\n/* Marquee strip */\n.marquee {\n  margin: 20px 0 80px;\n  padding: 20px 0;\n  border-top: 1px solid var(--ink-12);\n  border-bottom: 1px solid var(--ink-12);\n  overflow: hidden;\n  position: relative;\n  white-space: nowrap;\n}\n.marquee-track {\n ard .badge {\n  position: absolute;\n  top: 28px; right: 28px;\n  background: var(--pink);\n  color: var(--ink);\n  padding: 6px 12px;\n  border-radius: 999px;\n  font-size: 11px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  font-weight: 600;\n}\n.service-card.featured .badge {\n  background: var(--yellow);\n}\n\n.service-head {\n  padding-bottom: 24px;\n  border-bottom: 1px solid var(--ink-12);\n  margin-bottom: 24px;\n}\n.service-card.featured .service-head { border-color: rgba(246, 245, 240, 0.12); }\n\n.service-eyebrow {\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--ink-60);\n  margin-bottom: 16px;\n}\n.service-card.featured .service-eyebrow {\n  color: rgba(246, 245, 240, 0.6);\n  padding-right: 140px;\n}\n\n.service-card h3 {\n  font-size: 38px;\n  margin-bottom: 12px;\n  letter-spacing: -0.015em;\n}\n.service-desc {\n  font-size: 14.5px;\n  color: var(--ink-60);\n  line-height: 1.55;\n}\n\n.service-price {\n  margin: 24px 0;\n  display: flex;\n  align-items: baseline;\n  gap: 6px;\n}\n.service-price .num {\n  font-family: var(--serif);\n  font-size: 52px;\n  line-height: 1;\n  letter-spacing: -0.02em;\n}\n.service-price small {\n  font-size: 13px;\n  color: var(--ink-60);\n  letter-spacing: 0.02em;\n}\n\n.service-tags {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 6px;\n  margin-bottom: 24px;\n}\n.service-tag {\n  padding: 6px 12px;\n  border-radius: 999px;\n  font-size: 12px;\n  font-weight: 500;\n  border: 1px solid var(--ink-12);\n  color: var(--ink);\n  background: rgba(13, 13, 13, 0.03);\n  letter-spacing: 0.02em;\n}\n\n.service-list {\n  list-style: none;\n  margin-bottom: 28px;\n  flex: 1;\n}\n.service-list li {\n  padding: 12px 0;\n  font-size: 14.5px;\n  border-bottom: 1px solid var(--ink-12);\n  display: flex;\n  align-items: start;\n  gap: 12px;\n}\n.service-list li::before {\n  content: \"✓\";\n  color: var(--pink);\n  font-weight: bold;\n  font-size: 14px;\n  margin-top: 2px;\n}\n.service-card.featured .service-list li::before { color: var(--yellow); }\n\n.service-cta {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  padding: 14px 24px;\n  border-radius: 999px;\n  border: 1px solid currentColor;\n  font-size: 14px;\n  font-weight: 500;\n  width: 100%;\n  transition: all 0.5s var(--ease);\n}\n.service-cta:hover {\n  background: var(--ink);\n  color: var(--bg);\n  border-color: var(--ink);\n}\n.service-card.featured .service-cta {\n  background: var(--bg);\n  color: var(--ink);\n  border-color: var(--bg);\n}\n.service-card.featured .service-cta:hover {\n  background: var(--pink);\n  border-color: var(--pink);\n}\n\n/* Service card extras */\n.service-section-lbl {\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--ink-60);\n  margin-bottom: 12px;\n}\n.service-card.featured .service-section-lbl { color: rgba(246,245,240,0.5); }\n.service-for {\n  font-size: 13.5px;\n  color: var(--ink-60);\n  line-height: 1.5;\n  margin-top: 20px;\n  padding-top: 20px;\n  border-top: 1px solid var(--ink-08);\n  flex-grow: 1;\n}\n.service-card.featured .service-for { color: rgba(246,245,240,0.6); border-color: rgba(246,245,240,0.12); }\n.service-for strong { color: var(--ink); font-weight: 500; }\n.service-card.featured .service-for strong { color: var(--bg); }\n.service-time-tag {\n  display: inline-block;\n  margin-top: 14px;\n  font-size: 12px;\n  background: var(--ink-08);\n  border: 1px solid var(--ink-12);\n  border-radius: 999px;\n  padding: 4px 12px;\n  color: var(--ink-60);\n}\n.service-card.featured .service-time-tag { background: rgba(246,245,240,0.1); border-color: rgba(246,245,240,0.18); color: rgba(246,245,240,0.7); }\n\n/* Duos section */\n.duos-section {\n  margin-top: 80px;\n  padding-top: 80px;\n  border-top: 1px solid var(--ink-12);\n  padding-bottom: 100px;\n}\n.duos-grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 20px;\n  margin-top: 48px;\n}\n.duo-badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--ink);\n  background: var(--yellow);\n  padding: 5px 12px;\n  border-radius: 999px;\n  margin-bottom: 20px;\n}\n\n/* Process strip */\n.process {\n  padding: 60px 0 100px;\n  border-top: 1px solid var(--ink-12);\n}\n.process-grid {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 24px;\n  margin-top: 48px;\n}\n.process-step h4 {\n  font-family: var(--serif);\n  font-style: italic;\n  font-size: 18px;\n  color: var(--ink-60);\n  margin-bottom: 14px;\n}\n.process-step .step-title {\n  font-family: var(--serif);\n  font-size: 28px;\n  margin-bottom: 10px;\n  line-height: 1.1;\n}\n.process-step p {\n  color: var(--ink-60);\n  font-size: 14px;\n}\n\n/* ─────────────────────────────────────────────────────────────\n  13. CONTACT PAGE\n   ───────────────────────────────────────────────────────────── */\n.contact-grid {\n  display: grid;\n  grid-template-columns: 0.85fr 1.15fr;\n  gap: 64px;\n  padding-bottom: 80px;\n  align-items: start;\n}\n\n.contact-left .lead {\n  font-size: 19px;\n  color: var(--ink-60);\n  margin: 20px 0 36px;\n  max-width: 40ch;\n}\n\n.contact-email {\n  display: inline-flex;\n  align-items: center;\n  gap: 12px;\n  font-family: var(--serif);\n  font-size: 32px;\n  letter-spacing: -0.01em;\n  padding: 16px 0;\n  border-bottom: 1px solid var(--ink);\n  transition: color 0.4s var(--ease), border-color 0.4s var(--ease);\n}\n.contact-email:hover { color: var(--pink); border-color: var(--pink); }\n.contact-email svg { width: 18px; height: 18px; transition: transform 0.4s var(--ease); }\n.contact-email:hover svg { transform: translate(4px, -4px); }\n\n.socials {\n  display: flex;\n  gap: 12px;\n  margin-top: 40px;\n}\n.social {\n  width: 56px; height: 56px;\n  border-radius: 50%;\n  background: transparent;\n  border: 1px solid var(--ink-12);\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  transition: all 0.5s var(--ease);\n}\n.social:hover {\n  background: var(--pink);\n  border-color: var(--pink);\n  transform: translateY(-3px);\n}\n.social svg { width: 20px; height: 20px; }\n\n.contact-meta {\n  margin-top: 56px;\n  padding-top: 28px;\n  border-top: 1px solid var(--ink-12);\n  display: grid;\n  gap: 18px;\n}\n.contact-meta div { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; }\n.contact-meta dt { color: var(--ink-60); }\n\n/* Form */\n.contact-form {\n  background: var(--bg-2);\n  border: 1px solid var(--ink-08);\n  border-radius: var(--radius-lg);\n  padding: 40px;\n  position: relative;\n  overflow: hidden;\n}\n.form-row {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 18px;\n}\n.field {\n  margin-bottom: 18px;\n  position: relative;\n}\n.field label {\n  display: block;\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--ink-60);\n  margin-bottom: 8px;\n}\n.field input,\n.field textarea,\n.field select {\n  width: 100%;\n  padding: 14px 16px;\n  border-radius: var(--radius-sm);\n  border: 1px solid var(--ink-12);\n  background: var(--bg);\n  font-size: 15px;\n  transition: border-color 0.4s var(--ease), box-shadow 0.4s var(--ease), background 0.4s var(--ease);\n  font-family: var(--sans);\n}\n.field textarea { resize: vertical; min-height: 140px; }\n.field input::placeholder,\n.field textarea::placeholder { color: var(--ink-40); }\n.field input:focus,\n.field textarea:focus,\n.field select:focus {\n  outline: none;\n  border-color: var(--pink);\n  box-shadow: 0 0 0 4px rgba(252, 172, 245, 0.35);\n  background: var(--bg);\n}\n\n.chips {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  margin-bottom: 24px;\n}\n.chip {\n  padding: 9px 16px;\n  border-radius: 999px;\n  border: 1px solid var(--ink-12);\n  font-size: 13px;\n  font-weight: 500;\n  background: var(--bg);\n  transition: all 0.4s var(--ease);\n  cursor: pointer;\n}\n.chip:hover { border-color: var(--ink); }\n.chip.is-active { background: var(--ink); color: var(--bg); border-color: var(--ink); }\n\n.form-submit {\n  width: 100%;\n  padding: 18px;\n  background: var(--ink);\n  color: var(--bg);\n  border-radius: 999px;\n  font-size: 15px;\n  font-weight: 500;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 12px;\n  transition: all 0.5s var(--ease);\n}\n.form-submit:hover { background: var(--pink); color: var(--ink); }\n.form-submit svg { width: 16px; height: 16px; }\n\n/* Form Success State */\n.form-success {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  background: var(--bg-2);\n  padding: 40px;\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 0.7s var(--ease);\n}\n.contact-form.is-sent .form-success {\n  opacity: 1;\n  pointer-events: auto;\n}\n.contact-form.is-sent .form-inner {\n  opacity: 0;\n  transform: translateY(-12px);\n  transition: all 0.5s var(--ease);\n}\n.success-icon {\n  width: 88px; height: 88px;\n  border-radius: 50%;\n  background: var(--pink);\n  display: flex; align-items: center; justify-content: center;\n  margin-bottom: 24px;\n  animation: pop 0.6s var(--ease);\n}\n.success-icon svg { width: 36px; height: 36px; color: var(--ink); }\n@keyframes pop {\n  0% { transform: scale(0.4); opacity: 0; }\n  60% { transform: scale(1.08); }\n  100% { transform: scale(1); opacity: 1; }\n}\n.form-success h3 { font-size: 40px; margin-bottom: 12px; }\n.form-success h3 em { font-style: italic; color: var(--ink-60); }\n.form-success p { color: var(--ink-60); max-width: 36ch; margin-bottom: 24px; }\n.success-again {\n  font-size: 13px;\n  padding: 10px 20px;\n  border-radius: 999px;\n  border: 1px solid var(--ink);\n  transition: all 0.4s var(--ease);\n}\n.success-again:hover { background: var(--ink); color: var(--bg); }\n\n/* ─────────────────────────────────────────────────────────────\n  14. FOOTER\n   ───────────────────────────────────────────────────────────── */\n.footer {\n  border-top: 1px solid var(--ink-12);\n  padding: 60px 0 40px;\n  margin-top: 40px;\n}\n.footer-grid {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 40px;\n  margin-bottom: 60px;\n}\n.footer-brand .brand { font-size: 28px; }\n.footer-brand p {\n  margin-top: 16px;\n  color: var(--ink-60);\n  max-width: 30ch;\n  font-size: 14.5px;\n}\n.footer-col h5 {\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--ink-60);\n  margin-bottom: 18px;\n}\n.footer-col ul { list-style: none; display: flex; flex-direction: row; gap: 28px; }\n.footer-col a {\n  font-size: 14.5px;\n  color: var(--ink);\n  transition: color 0.4s var(--ease);\n}\n.footer-col a:hover { color: var(--pink); }\n.footer-bottom {\n  display: flex;\n  justify-content: space-between;\n  font-size: 13px;\n  color: var(--ink-60);\n  padding-top: 24px;\n  border-top: 1px solid var(--ink-12);\n  flex-wrap: wrap;\n  gap: 12px;\n}\n.footer-big {\n  font-family: var(--serif);\n  font-size: clamp(80px, 16vw, 240px);\n  line-height: 0.85;\n  letter-spacing: -0.04em;\n  color: var(--ink);\n  text-align: center;\n  padding: 40px 0 20px;\n  user-select: none;\n}\n.footer-big em { font-style: italic; color: var(--ink-60); }\n\n/* ─────────────────────────────────────────────────────────────\n  15. RESPONSIVE\n   ───────────────────────────────────────────────────────────── */\n@media (max-width: 1024px) {\n  .hero { padding: 40px 0 60px; }\n  .hero-visual { max-width: 480px; }\n  .pillars { grid-template-columns: 1fr; }\n  .pillar { min-height: auto; }\n  .presenting { grid-template-columns: 1fr; gap: 40px; }\n  .presenting-img { max-width: 440px; aspect-ratio: 4/4; }\n  .projects { grid-template-columns: 1fr; gap: 32px; }\n  .services-grid { grid-template-columns: 1fr; }\n  .duos-grid { grid-template-columns: 1fr; }\n  .process-grid { grid-template-columns: repeat(2, 1fr); }\n  .contact-grid { grid-template-columns: 1fr; gap: 40px; }\n  .projects \u003e .project { grid-column: span 12 !important; }\n  .footer-grid { grid-template-columns: 1fr 1fr; }\n}\n@media (max-width: 700px) {\n  main { padding-top: 100px; }\n  .header-pill { padding: 6px 6px 6px 18px; gap: 12px; }\n  .nav { display: none; }\n  .nav-cta { display: none; }\n  .mobile-toggle { display: inline-flex; }\n  .section { padding: 60px 0; }\n  .form-row { grid-template-columns: 1fr; }\n  .contact-form { padding: 28px 22px; }\n  .footer-grid { grid-template-columns: 1fr; gap: 28px; }\n  .footer-bottom { font-size: 12px; }\n  .presenting-meta { grid-template-columns: 1fr 1fr; }\n  .process-grid { grid-template-columns: 1fr; }\n  .hero h1 { font-size: clamp(44px, 11vw, 80px); }\n  .presenting-img::after { font-size: 140px; }\n  .proj-info-bar { grid-template-columns: repeat(2, 1fr); }\n  .proj-body { grid-template-columns: 1fr; gap: 40px; }\n  .proj-img-duo { grid-template-columns: 1fr; }\n  .proj-detail h1 { font-size: clamp(52px, 12vw, 100px); }\n}\n\u003c/style\u003e\n\n\u003cstyle\u003e\n/* ═══════════════════════════════════\n   PROJECT DETAIL PAGES\n   ═══════════════════════════════════ */\n.proj-detail {\n  padding: 48px 0 120px;\n}\n.back-link {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  font-size: 13.5px;\n  font-weight: 500;\n  color: var(--ink-60);\n  letter-spacing: 0.04em;\n  margin-bottom: 48px;\n  transition: color 0.3s var(--ease);\n  text-decoration: none;\n}\n.back-link svg { transition: transform 0.3s var(--ease); }\n.back-link:hover { color: var(--ink); }\n.back-link:hover svg { transform: translateX(-4px); }\n\n.proj-detail h1 {\n  font-size: clamp(60px, 9vw, 130px);\n  line-height: 0.93;\n  letter-spacing: -0.03em;\n  margin-top: 12px;\n}\n.proj-detail h1 em { font-style: italic; color: var(--ink-60); }\n\n.proj-info-bar {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 0;\n  border-top: 1px solid var(--ink-12);\n  border-bottom: 1px solid var(--ink-12);\n  margin: 44px 0 56px;\n}\n.proj-info-item {\n  padding: 24px 28px 24px 20px;\n  border-right: 1px solid var(--ink-12);\n}\n.proj-info-item:last-child { border-right: none; }\n.proj-info-item dt {\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--ink-60);\n  margin-bottom: 8px;\n}\n.proj-info-item dd {\n  font-size: 15px;\n  color: var(--ink);\n  font-weight: 400;\n}\n\n/* Image blocks */\n.proj-img-hero {\n  width: 100%;\n  aspect-ratio: 16 / 9;\n  border-radius: var(--radius-lg);\n  overflow: hidden;\n  margin-bottom: 80px;\n  background-size: cover;\n  background-position: center;\n  background-color: var(--bg-2);\n  border: 1px solid var(--ink-08);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: var(--ink-60);\n  font-size: 13px;\n  letter-spacing: 0.06em;\n}\n.proj-img-full {\n  width: 100%;\n  aspect-ratio: 16 / 9;\n  border-radius: var(--radius);\n  overflow: hidden;\n  background-size: cover;\n  background-position: center;\n  background-color: var(--bg-2);\n  border: 1px solid var(--ink-08);\n  margin: 64px 0;\n}\n.proj-img-tall {\n  width: 100%;\n  aspect-ratio: 3 / 4;\n  border-radius: var(--radius);\n  overflow: hidden;\n  background-size: cover;\n  background-position: center;\n  background-color: var(--bg-2);\n  border: 1px solid var(--ink-08);\n}\n.proj-img-sq {\n  width: 100%;\n  aspect-ratio: 1;\n  border-radius: var(--radius);\n  overflow: hidden;\n  background-size: cover;\n  background-position: center;\n  background-color: var(--bg-2);\n  border: 1px solid var(--ink-08);\n}\n.proj-img-duo {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 16px;\n  margin: 64px 0;\n}\n.proj-img-trio {\n  display: grid;\n  grid-template-columns: 2fr 1fr;\n  gap: 16px;\n  margin: 40px 0;\n}\n.proj-img-trio-right {\n  display: grid;\n  gap: 16px;\n}\n\n/* Layout text + image */\n.proj-body {\n  display: grid;\n  grid-template-columns: 1fr 1.8fr;\n  gap: 80px;\n  align-items: start;\n  margin-bottom: 72px;\n}\n.proj-sidebar {\n  position: sticky;\n  top: 100px;\n}\n.proj-sidebar h3 {\n  font-size: 14px;\n  font-weight: 600;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--ink-60);\n  margin-bottom: 20px;\n}\n.proj-content h2 {\n  font-size: clamp(28px, 3.5vw, 48px);\n  letter-spacing: -0.02em;\n  line-height: 1.1;\n  margin-bottom: 20px;\n}\n.proj-content h2 em { font-style: italic; color: var(--ink-60); }\n.proj-content p {\n  font-size: 17px;\n  line-height: 1.7;\n  color: var(--ink-60);\n  margin-bottom: 18px;\n}\n.proj-content p strong { color: var(--ink); font-weight: 500; }\n.proj-content ul {\n  padding-left: 0;\n  list-style: none;\n  margin: 24px 0;\n}\n.proj-content ul li {\n  font-size: 16px;\n  line-height: 1.6;\n  color: var(--ink-60);\n  padding: 12px 0;\n  border-bottom: 1px solid var(--ink-08);\n  display: flex;\n  gap: 12px;\n}\n.proj-content ul li::before {\n  content: \"✦\";\n  color: var(--pink);\n  font-size: 10px;\n  margin-top: 5px;\n  flex-shrink: 0;\n}\n.proj-content ul li strong { color: var(--ink); font-weight: 500; }\n\n/* Tag chips inside detail */\n.proj-tags {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  margin-bottom: 32px;\n}\n.proj-tag {\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  color: var(--ink);\n  background: transparent;\n  border: 1px solid var(--ink-12);\n  padding: 6px 14px;\n  border-radius: 999px;\n}\n\n/* Divider section */\n.proj-divider {\n  border: none;\n  border-top: 1px solid var(--ink-12);\n  margin: 64px 0;\n}\n\n/* Next project */\n.proj-next {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 48px 0;\n  border-top: 1px solid var(--ink-12);\n  margin-top: 80px;\n  text-decoration: none;\n  gap: 24px;\n  transition: opacity 0.3s;\n}\n.proj-next:hover { opacity: 0.7; }\n.proj-next-label {\n  font-size: 12px;\n  font-weight: 600;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--ink-60);\n  margin-bottom: 8px;\n}\n.proj-next h3 {\n  font-size: clamp(28px, 4vw, 52px);\n  letter-spacing: -0.02em;\n}\n.proj-next-arrow {\n  width: 56px; height: 56px;\n  border-radius: 50%;\n  background: var(--ink);\n  color: var(--bg);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\u003c/style\u003e\n\n\u003cstyle\u003e\n/* Contacto simplificado */\n.contact-simple {\n  max-width: 960px;\n  padding-bottom: 120px;\n}\n.contact-simple-lead {\n  font-size: 18px;\n  color: var(--ink-60);\n  line-height: 1.65;\n  margin-bottom: 48px;\n}\n.contact-mailto-block {\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n  padding: 32px 36px;\n  border: 1px solid var(--ink-12);\n  border-radius: var(--radius-lg);\n  background: var(--bg-2);\n  text-decoration: none;\n  transition: border-color 0.4s var(--ease), transform 0.4s var(--ease);\n  margin-bottom: 48px;\n}\n.contact-mailto-block:hover { border-color: var(--pink); transform: translateY(-3px); }\n.contact-mailto-label {\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--ink-60);\n}\n.contact-mailto-address {\n  font-size: clamp(22px, 3.5vw, 34px);\n  font-weight: 400;\n  color: var(--ink);\n  letter-spacing: -0.01em;\n  display: flex;\n  align-items: center;\n  gap: 12px;\n}\n.contact-mailto-hint {\n  font-size: 13px;\n  color: var(--ink-60);\n}\n.contact-simple-meta {\n  display: flex;\n  gap: 48px;\n  flex-wrap: wrap;\n}\n.meta-lbl-sm {\n  display: block;\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--ink-60);\n  margin-bottom: 4px;\n}\n.meta-val-sm {\n  display: block;\n  font-size: 15px;\n  color: var(--ink);\n}\n\n/* Links a sitios en vivo */\n.proj-live-link {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  margin-top: 24px;\n  margin-right: 12px;\n  font-size: 14px;\n  font-weight: 600;\n  color: var(--ink);\n  text-decoration: none;\n  border-bottom: 2px solid var(--pink);\n  padding-bottom: 2px;\n  transition: border-color 0.3s, color 0.3s;\n}\n.proj-live-link:hover { color: var(--pink); border-color: var(--pink); }\n.proj-links { display: flex; flex-wrap: wrap; gap: 4px; }\n\n/* Grilla de sitios web (página Veoveo) */\n.proj-sites-grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 4px 32px;\n  margin-top: 28px;\n}\n.proj-site-link {\n  display: flex;\n  align-items: center;\n  font-size: 15px;\n  color: var(--ink);\n  text-decoration: none;\n  padding: 12px 0;\n  border-bottom: 1px solid var(--ink-12);\n  transition: color 0.3s, padding-left 0.3s;\n}\n.proj-site-link:hover { color: var(--pink); padding-left: 8px; }\n.proj-sites-note {\n  font-size: 13px;\n  color: var(--ink-60);\n  margin-top: 20px;\n}\n\n/* Número de case study (01, 02, 03) */\n.cs-num {\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--ink-60);\n  margin-bottom: 6px;\n}\n@media (max-width: 600px) {\n  .proj-sites-grid { grid-template-columns: 1fr; gap: 0; }\n}\n\n/* Ocultar header en páginas de detalle */\n.on-project .header,\n.on-project .mobile-drawer { display: none !important; }\n\n/* Dark mode desactivado — el sitio siempre usa el tema claro */\n\n/* Mobile fixes */\n@media (max-width: 600px) {\n  .hero-text { max-width: 100%; }\n  .hero h1 { font-size: clamp(38px, 10vw, 68px); }\n  .proj-info-bar { grid-template-columns: 1fr 1fr; }\n  .proj-body { grid-template-columns: 1fr; gap: 32px; }\n  .proj-img-duo, .proj-img-trio { grid-template-columns: 1fr; }\n  .footer-grid { flex-direction: column; align-items: flex-start; gap: 24px; }\n  .footer-col ul { flex-direction: column; gap: 12px; }\n  .duos-grid { grid-template-columns: 1fr; }\n  .proj-detail h1 { font-size: clamp(44px, 13vw, 80px); }\n}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003c!-- ─────────── HEADER ─────────── --\u003e\n\u003cheader class=\"header\"\u003e\n  \u003cdiv class=\"header-pill\"\u003e\n    \u003ca class=\"brand\" href=\"#home\" data-route=\"home\"\u003e\n      \u003cspan class=\"brand-dot\"\u003e\u003c/span\u003e\n      \u003cspan\u003eZowi \u003cem style=\"font-style: italic; color: var(--ink-60);\"\u003estudio\u003c/em\u003e\u003c/span\u003e\n    \u003c/a\u003e\n    \u003cnav class=\"nav\" id=\"nav\"\u003e\n      \u003ca href=\"#home\" data-route=\"home\" class=\"nav-link is-active\"\u003eHome\u003c/a\u003e\n      \u003ca href=\"#portfolio\" data-route=\"portfolio\" class=\"nav-link\"\u003ePortfolio\u003c/a\u003e\n      \u003ca href=\"#services\" data-route=\"services\" class=\"nav-link\"\u003eServicios\u003c/a\u003e\n    \u003c/nav\u003e\n    \u003ca href=\"#contact\" data-route=\"contact\" class=\"nav-cta\"\u003eTrabajar conmigo →\u003c/a\u003e\n    \u003cbutton class=\"mobile-toggle\" id=\"mobile-toggle\" aria-label=\"Abrir menú\"\u003e\n      \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"\u003e\u003cpath d=\"M3 6h18M3 12h18M3 18h18\"\u003e\u003c/path\u003e\u003c/svg\u003e\n    \u003c/button\u003e\n  \u003c/div\u003e\n\u003c/header\u003e\n\n\u003c!-- Mobile drawer --\u003e\n\u003caside class=\"mobile-drawer\" id=\"mobile-drawer\"\u003e\n  \u003ca href=\"#home\" data-route=\"home\" class=\"nav-link is-active\"\u003eHome\u003c/a\u003e\n  \u003ca href=\"#portfolio\" data-route=\"portfolio\" class=\"nav-link\"\u003ePortfolio\u003c/a\u003e\n  \u003ca href=\"#services\" data-route=\"services\" class=\"nav-link\"\u003eServicios\u003c/a\u003e\n  \u003ca href=\"#contact\" data-route=\"contact\" class=\"nav-link\"\u003eTrabajar conmigo\u003c/a\u003e\n\u003c/aside\u003e\n\n\u003cmain id=\"app\"\u003e\n\n  \u003c!-- ════════════════════════════════════════════════════════════\n       HOME PAGE\n       ════════════════════════════════════════════════════════════ --\u003e\n  \u003csection class=\"page is-active\" data-page=\"home\" data-screen-label=\"01 Home\"\u003e\n\n    \u003c!-- Hero --\u003e\n    \u003cdiv class=\"container\"\u003e\n      \u003cdiv class=\"hero\"\u003e\n        \u003cdiv class=\"hero-text\"\u003e\n          \u003ch1 data-reveal=\"\" style=\"--i:0;\"\u003e\n            Hola, soy \u003cspan class=\"accent-pink\"\u003eZoe del Moral\u003c/span\u003e \u003cem\u003e—\u003c/em\u003e\u003cbr\u003e\n            diseñadora especializada en \u003cem\u003eweb\u003c/em\u003e, \u003cem\u003eUI\u003c/em\u003e y \u003cem\u003egráfico\u003c/em\u003e.\n          \u003c/h1\u003e\n          \u003cdiv class=\"hero-actions\" data-reveal=\"\" style=\"--i:1;\"\u003e\n            \u003ca href=\"#contact\" data-route=\"contact\" class=\"btn btn-primary\"\u003e\n              Trabajar conmigo\n              \u003cspan class=\"arrow\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"\u003e\u003cpath d=\"M5 12h14M13 5l7 7-7 7\"\u003e\u003c/path\u003e\u003c/svg\u003e\u003c/span\u003e\n            \u003c/a\u003e\n            \u003ca href=\"#portfolio\" data-route=\"portfolio\" class=\"btn btn-ghost\"\u003e\n              Ver portfolio\n              \u003cspan class=\"arrow\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"\u003e\u003cpath d=\"M5 12h14M13 5l7 7-7 7\"\u003e\u003c/path\u003e\u003c/svg\u003e\u003c/span\u003e\n            \u003c/a\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- Marquee --\u003e\n    \u003cdiv class=\"marquee\" data-reveal=\"\" style=\"--i:5;\"\u003e\n      \u003cdiv class=\"marquee-track\"\u003e\n        \u003cspan class=\"marquee-item\"\u003eDiseño Web\u003c/span\u003e\n        \u003cspan class=\"marquee-item\"\u003eUX/UI\u003c/span\u003e\n        \u003cspan class=\"marquee-item\"\u003eDiseño Gráfico\u003c/span\u003e\n        \u003cspan class=\"marquee-item\"\u003eDiseño Web\u003c/span\u003e\n        \u003cspan class=\"marquee-item\"\u003eUX/UI\u003c/span\u003e\n        \u003cspan class=\"marquee-item\"\u003eDiseño Gráfico\u003c/span\u003e\n        \u003cspan class=\"marquee-item\"\u003eDiseño Web\u003c/span\u003e\n        \u003cspan class=\"marquee-item\"\u003eUX/UI\u003c/span\u003e\n        \u003cspan class=\"marquee-item\"\u003eDiseño Gráfico\u003c/span\u003e\n        \u003cspan class=\"marquee-item\"\u003eDiseño Web\u003c/span\u003e\n        \u003cspan class=\"marquee-item\"\u003eUX/UI\u003c/span\u003e\n        \u003cspan class=\"marquee-item\"\u003eDiseño Gráfico\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- 3 Pillars --\u003e\n    \u003cdiv class=\"container\"\u003e\n      \u003cdiv class=\"section\"\u003e\n        \u003cdiv class=\"section-head\"\u003e\n          \u003ch2\u003e\u003cem\u003eTres pilares.\u003c/em\u003e\u003cbr\u003eUna mirada.\u003c/h2\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"pillars\"\u003e\n          \u003c!-- Pillar 01 --\u003e\n          \u003cdiv class=\"pillar\" data-route=\"portfolio\"\u003e\n            \u003cspan class=\"pillar-num\"\u003e01 / UX/UI\u003c/span\u003e\n            \u003cdiv class=\"pillar-graphic\"\u003e\n              \u003csvg class=\"pgraphic\" viewBox=\"0 0 200 200\" fill=\"none\"\u003e\n                \u003crect x=\"20\" y=\"20\" width=\"160\" height=\"120\" rx=\"14\" stroke=\"currentColor\" stroke-width=\"2\"\u003e\u003c/rect\u003e\n                \u003crect x=\"20\" y=\"20\" width=\"160\" height=\"22\" rx=\"14\" fill=\"currentColor\"\u003e\u003c/rect\u003e\n                \u003ccircle cx=\"34\" cy=\"31\" r=\"3\" fill=\"#F6F5F0\"\u003e\u003c/circle\u003e\n                \u003ccircle cx=\"46\" cy=\"31\" r=\"3\" fill=\"#F6F5F0\"\u003e\u003c/circle\u003e\n                \u003ccircle cx=\"58\" cy=\"31\" r=\"3\" fill=\"#F6F5F0\"\u003e\u003c/circle\u003e\n                \u003crect x=\"36\" y=\"60\" width=\"80\" height=\"8\" rx=\"4\" fill=\"currentColor\"\u003e\u003c/rect\u003e\n                \u003crect x=\"36\" y=\"76\" width=\"120\" height=\"4\" rx=\"2\" fill=\"currentColor\" opacity=\"0.5\"\u003e\u003c/rect\u003e\n                \u003crect x=\"36\" y=\"86\" width=\"100\" height=\"4\" rx=\"2\" fill=\"currentColor\" opacity=\"0.5\"\u003e\u003c/rect\u003e\n                \u003crect x=\"36\" y=\"106\" width=\"44\" height=\"22\" rx=\"11\" fill=\"#FCACF5\" stroke=\"currentColor\" stroke-width=\"2\"\u003e\u003c/rect\u003e\n                \u003ccircle cx=\"160\" cy=\"160\" r=\"22\" fill=\"#F8EA65\" stroke=\"currentColor\" stroke-width=\"2\"\u003e\u003c/circle\u003e\n              \u003c/svg\u003e\n            \u003c/div\u003e\n            \u003cdiv\u003e\n              \u003ch3\u003eUX/UI\u003c/h3\u003e\n              \u003cp\u003eDiseño web \u0026 mobile para marcas y productos digitales que buscan interfaces estéticas e intuitivas.\u003c/p\u003e\n              \u003cspan class=\"pillar-go\"\u003e\n                Ver proyectos\n                \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"\u003e\u003cpath d=\"M5 12h14M13 5l7 7-7 7\"\u003e\u003c/path\u003e\u003c/svg\u003e\n              \u003c/span\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n\n          \u003c!-- Pillar 02 --\u003e\n          \u003cdiv class=\"pillar\" data-route=\"portfolio\"\u003e\n            \u003cspan class=\"pillar-num\"\u003e02 / Diseño Web\u003c/span\u003e\n            \u003cdiv class=\"pillar-graphic\"\u003e\n              \u003csvg class=\"pgraphic\" viewBox=\"0 0 200 200\" fill=\"none\"\u003e\n                \u003crect x=\"30\" y=\"30\" width=\"60\" height=\"100\" rx=\"10\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"#FCACF5\"\u003e\u003c/rect\u003e\n                \u003crect x=\"100\" y=\"30\" width=\"60\" height=\"44\" rx=\"10\" stroke=\"currentColor\" stroke-width=\"2\"\u003e\u003c/rect\u003e\n                \u003crect x=\"100\" y=\"84\" width=\"60\" height=\"46\" rx=\"10\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"#F8EA65\"\u003e\u003c/rect\u003e\n                \u003ccircle cx=\"60\" cy=\"160\" r=\"14\" stroke=\"currentColor\" stroke-width=\"2\"\u003e\u003c/circle\u003e\n                \u003ccircle cx=\"100\" cy=\"160\" r=\"14\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"currentColor\"\u003e\u003c/circle\u003e\n                \u003ccircle cx=\"140\" cy=\"160\" r=\"14\" stroke=\"currentColor\" stroke-width=\"2\"\u003e\u003c/circle\u003e\n                \u003cline x1=\"74\" y1=\"160\" x2=\"86\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"\u003e\u003c/line\u003e\n                \u003cline x1=\"114\" y1=\"160\" x2=\"126\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"\u003e\u003c/line\u003e\n              \u003c/svg\u003e\n            \u003c/div\u003e\n            \u003cdiv\u003e\n              \u003ch3\u003eDiseño Web\u003c/h3\u003e\n              \u003cp\u003eTu sitio web o tienda online (WordPress, Tiendanube) diseñada a medida para que empieces a vender y destaques en internet.\u003c/p\u003e\n              \u003cspan class=\"pillar-go\"\u003e\n                Ver proyectos\n                \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"\u003e\u003cpath d=\"M5 12h14M13 5l7 7-7 7\"\u003e\u003c/path\u003e\u003c/svg\u003e\n              \u003c/span\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n\n          \u003c!-- Pillar 03 --\u003e\n          \u003cdiv class=\"pillar\" data-route=\"portfolio\"\u003e\n            \u003cspan class=\"pillar-num\"\u003e03 / Case Studies\u003c/span\u003e\n            \u003cdiv class=\"pillar-graphic\"\u003e\n              \u003csvg class=\"pgraphic\" viewBox=\"0 0 200 200\" fill=\"none\"\u003e\n                \u003ccircle cx=\"100\" cy=\"100\" r=\"62\" fill=\"#FCACF5\"\u003e\u003c/circle\u003e\n                \u003ccircle cx=\"100\" cy=\"100\" r=\"62\" stroke=\"#F6F5F0\" stroke-width=\"2\" stroke-dasharray=\"4 6\"\u003e\u003c/circle\u003e\n                \u003cpath d=\"M70 80 Q100 50 130 80 T130 140 Q100 170 70 140 T70 80Z\" fill=\"#F8EA65\" stroke=\"#0D0D0D\" stroke-width=\"2\"\u003e\u003c/path\u003e\n                \u003ccircle cx=\"100\" cy=\"100\" r=\"14\" fill=\"#0D0D0D\"\u003e\u003c/circle\u003e\n                \u003ccircle cx=\"100\" cy=\"100\" r=\"6\" fill=\"#F6F5F0\"\u003e\u003c/circle\u003e\n              \u003c/svg\u003e\n            \u003c/div\u003e\n            \u003cdiv\u003e\n              \u003ch3\u003eCase Studies\u003c/h3\u003e\n              \u003cp\u003eUna mirada profunda a mis proyectos más grandes: investigación, procesos creativos y conceptos visuales completos.\u003c/p\u003e\n              \u003cspan class=\"pillar-go\"\u003e\n                Ver proyectos\n                \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"\u003e\u003cpath d=\"M5 12h14M13 5l7 7-7 7\"\u003e\u003c/path\u003e\u003c/svg\u003e\n              \u003c/span\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- Presentándome --\u003e\n    \u003cdiv class=\"container\"\u003e\n      \u003cdiv class=\"section presenting\"\u003e\n        \u003cdiv class=\"presenting-img\" data-reveal=\"\" style=\"--i:0;\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"presenting-body\" data-reveal=\"\" style=\"--i:1;\"\u003e\n          \u003cspan class=\"eyebrow\" style=\"margin-bottom: 24px; display: inline-flex;\"\u003eSobre mí ✦\u003c/span\u003e\n          \u003ch2\u003e¿Quién es \u003cem\u003eZowi\u003c/em\u003e?\u003c/h2\u003e\n          \u003cp\u003e\n            ¡Hola! Soy \u003cstrong\u003eZoe del Moral\u003c/strong\u003e, pero todo el mundo me dice Zowi. Soy diseñadora y me especializo en diseño web, UX/UI y diseño gráfico.\n          \u003c/p\u003e\n          \u003cp\u003e\n            Básicamente, me encanta agarrar una idea desde cero y meterle mano a todo: desde investigar y armar cómo va a funcionar, hasta diseñar las pantallas y tirar el código frontend para que quede impecable. Creo firmemente que el mejor diseño es el que te hace la vida fácil y se ve lindo sin esforzarse.\n          \u003c/p\u003e\n          \u003ca href=\"#contact\" data-route=\"contact\" class=\"btn btn-primary\"\u003e\n            Iniciar un proyecto\n            \u003cspan class=\"arrow\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"\u003e\u003cpath d=\"M5 12h14M13 5l7 7-7 7\"\u003e\u003c/path\u003e\u003c/svg\u003e\u003c/span\u003e\n          \u003c/a\u003e\n          \u003cdiv class=\"presenting-meta\"\u003e\n            \u003cdiv\u003e\n              \u003cspan class=\"meta-num\"\u003e+3\u003c/span\u003e\n              \u003cspan class=\"meta-lbl\"\u003eAños diseñando\u003c/span\u003e\n            \u003c/div\u003e\n            \u003cdiv\u003e\n              \u003cspan class=\"meta-num\"\u003e+10\u003c/span\u003e\n              \u003cspan class=\"meta-lbl\"\u003eProyectos online\u003c/span\u003e\n            \u003c/div\u003e\n            \u003cdiv\u003e\n              \u003cspan class=\"meta-num\"\u003e∞\u003c/span\u003e\n              \u003cspan class=\"meta-lbl\"\u003eCafé diario\u003c/span\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ════════════════════════════════════════════════════════════\n       PORTFOLIO PAGE\n       ════════════════════════════════════════════════════════════ --\u003e\n  \u003csection class=\"page\" data-page=\"portfolio\" data-screen-label=\"02 Portfolio\"\u0 ecto\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"proj-content\"\u003e\n            \u003ch2\u003eDesarrollo web y \u003cem\u003ee-commerce\u003c/em\u003e a medida.\u003c/h2\u003e\n            \u003cp\u003e\n              Trabajando para Duemix, mi rol principal fue el \u003cstrong\u003edesarrollo completo del sitio web en WordPress y la tienda online en Tiendanube\u003c/strong\u003e de Ancestra. También colaboré en decisiones de diseño web, pero la parte técnica fue mi fuerte acá.\n            \u003c/p\u003e\n            \u003cp\u003e\n              El proyecto implicó configurar desde cero ambas plataformas, asegurando que la estética visual sea consistente entre el sitio institucional y la tienda, y que todo funcione de forma fluida para el usuario final.\n            \u003c/p\u003e\n            \u003cul\u003e\n              \u003cli\u003e\u003cstrong\u003eDesarrollo WordPress\u003c/strong\u003e Construcción del sitio institucional con diseño a medida.\u003c/li\u003e\n              \u003cli\u003e\u003cstrong\u003eTienda en Tiendanube\u003c/strong\u003e Configuración completa: productos, envíos y pasarelas de pago.\u003c/li\u003e\n              \u003cli\u003e\u003cstrong\u003eDiseño web\u003c/strong\u003e Apoyo en decisiones visuales y consistencia entre plataformas.\u003c/li\u003e\n              \u003cli\u003e\u003cstrong\u003eResponsive\u003c/strong\u003e Adaptación para celulares, tablets y escritorio.\u003c/li\u003e\n            \u003c/ul\u003e\n            \u003cdiv class=\"proj-links\"\u003e\n              \u003ca href=\"https://ancestrasuplementos.com/\" target=\"_blank\" rel=\"noopener\" class=\"proj-live-link\"\u003e\n                Ver sitio web ↗\n              \u003c/a\u003e\n              \u003ca href=\"https://ancestrasuplementos.mitiendanube.com/\" target=\"_blank\" rel=\"noopener\" class=\"proj-live-link\"\u003e\n                Ver tienda ↗\n              \u003c/a\u003e\n            \u003c/div\u003e\n          \u003c/di cambian todo el tiempo, Modé te da una solución práctica para arrancar el día sin dramas.\n            \u003c/p\u003e\n            \u003cdiv class=\"proj-links\"\u003e\n              \u003ca href=\"https://www.behance.net/gallery/194397837/mod-Case-Study-UXUI\" target=\"_blank\" rel=\"noopener\" class=\"proj-live-link\"\u003eVer en Behance ↗\u003c/a\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"proj-img-full\" style=\"background-image: url(\u0027img/cs-mode.gif\u0027); background-size: cover; background-position: center; background-color: #FCACF5;\"\u003e\u003c/div\u003e\n\n        \u003c!-- ── 03 Gróovy ────────────────────────────────────────── --\u003e\n        \u003chr class=\"proj-divider\"\u003e\n\n        \u003cdiv class=\"proj-body\"\u003e\n          \u003cdiv class=\"proj-sidebar\"\u003e\n            \u003cp class=\"cs-num\"\u003e03\u003c/p\u003e\n            \u003ch3\u003eGróovy\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"proj-content\"\u003e\n            \u003ch2\u003eToda tu música, \u003cem\u003een comunidad.\u003c/em\u003e\u003c/h2\u003e\n            \u003cp\u003e\n              Gróovy es una plataforma social para registrar toda la música que escuchás y cultivar tu pasión musical con amigos. Escribí reseñas, puntuá álbumes y armá listas en una comunidad musical en constante crecimiento. Descubrí nuevas canciones, conectá con otros fanáticos y creá una experiencia musical única y colaborativa.\n            \u003c/p\u003e\n            \u003cdiv class=\"proj-links\"\u003e\n              \u003ca href=\"https://www.behance.net/gallery/196045287/Groovy-Website-design\" target=\"_blank\" rel=\"noopener\" class=\"proj-live-link\"\u003eVer en Behance ↗\u003c/a\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"proj-img-duo\"\u003e\n          \u003cdiv class=\"proj-img-sq\" style=\"background-image: url(\u0027img/cs-groovy.gif\u0027); background-size: cover; background-position: center; background-color: #0D0D0D;\"\u003e\u003c/div\u003e\n          \u003cdiv class=\"proj-img-sq\" style=\"background-image: url(\u0027img/cs-groovy-ig.png\u0027); background-size: cover; background-position: left center; background-color: #1a1a2e;\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003ca href=\"#portfolio\" data-route=\"portfolio\" class=\"proj-next\"\u003e\n          \u003cdiv\u003e\n            \u003cp class=\"proj-next-label\"\u003eVolver al inicio\u003c/p\u003e\n            \u003ch3\u003eVer todos los trabajos\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cspan class=\"proj-next-arrow\"\u003e\n            \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"20\" height=\"20\"\u003e\u003cpath d=\"M5 12h14M13 5l7 7-7 7\"\u003e\u003c/path\u003e\u003c/svg\u003e\n          \u003c/span\u003e\n        \u003c/a\u003e\n\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n\u003cfooter class=\"footer\"\u003e\n    \u003cdiv class=\"container\"\u003e\n      \u003cdiv class=\"footer-grid\"\u003e\n        \u003cdiv class=\"footer-brand\"\u003e\n          \u003ca class=\"brand\" href=\"#home\" data-route=\"home\"\u003e\n            \u003cspan class=\"brand-dot\"\u003e\u003c/span\u003e\n            \u003cspan\u003eZowi \u003cem style=\"font-style: italic; color: var(--ink-60);\"\u003estudio\u003c/em\u003e\u003c/span\u003e\n          \u003c/a\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"footer-col\"\u003e\n          \u003cul\u003e\n            \u003cli\u003e\u003ca href=\"\" target=\"_blank\" rel=\"noopener\"\u003eLinkedIn ↗\u003c/a\u003e\u003c/li\u003e\n            \u003cli\u003e\u003ca href=\"\" target=\"_blank\" rel=\"noopener\"\u003eBehance ↗\u003c/a\u003e\u003c/li\u003e\n          \u003c/ul\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"footer-big\"\u003eZowi\u003cem\u003e.\u003c/em\u003e\u003c/div\u003e\n      \u003cdiv class=\"footer-bottom\"\u003e\n        \u003cspan\u003e© 2026 Zowi Studio · Hecho con ♥ en Argentina.\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/footer\u003e\n\n\n\n\u003c!-- ════════════════════════════════════════════════════════════\n       CORA — Detalle de proyecto\n       ════════════════════════════════════════════════════════════ --\u003e\n\n\u003c/main\u003e\n\n\u003cscript\u003e\n/* ─────────────────────────────────────────────────────────────\n   ROUTER (lightweight hash-based)\n   ───────────────────────────────────────────────────────────── */\n(function () {\n  const PAGES = [\u0027home\u0027, \u0027portfolio\u0027, \u0027services\u0027, \u0027contact\u0027, \u0027cora\u0027, \u0027ancestra\u0027, \u0027veoveo\u0027, \u0027casestudies\u0027];\n  const pageEls = document.querySelectorAll(\u0027.page\u0027);\n  const navLinks = document.querySelectorAll(\u0027.nav-link, .nav-cta\u0027);\n  const drawer = document.getElementById(\u0027mobile-drawer\u0027);\n  const toggle = document.getElementById(\u0027mobile-toggle\u0027);\n\n  function getRouteFromHash () {\n    const h = (location.hash || \u0027#home\u0027).replace(\u0027#\u0027, \u0027\u0027);\n    return PAGES.includes(h) ? h : \u0027home\u0027;\n  }\n\n  function setActive (route) {\n    // Pages\n    pageEls.forEach(p =\u003e {\n      const is = p.dataset.page === route;\n      // Force reflow to restart animation\n      if (is) {\n        p.classList.remove(\u0027is-active\u0027);\n        void p.offsetWidth;\n        p.classList.add(\u0027is-active\u0027);\n      } else {\n        p.classList.remove(\u0027is-active\u0027);\n      }\n    });\n    // Nav links\n    document.querySelectorAll(\u0027[data-route]\u0027).forEach(a =\u003e {\n      if (a.classList.contains(\u0027nav-link\u0027)) {\n        a.classList.toggle(\u0027is-active\u0027, a.dataset.route === route);\n      }\n    });\n    // Scroll up\n    window.scrollTo({ top: 0, behavior: \u0027instant\u0027 in window ? \u0027instant\u0027 : \u0027auto\u0027 });\n    // Hide header on project detail pages\n    const projectPages = [\u0027cora\u0027, \u0027ancestra\u0027, \u0027veoveo\u0027, \u0027casestudies\u0027];\n    document.body.classList.toggle(\u0027on-project\u0027, projectPages.includes(route));\n    // Close mobile drawer\n    drawer.classList.remove(\u0027is-open\u0027);\n  }\n\n  // Delegate clicks for any [data-route]\n  document.addEventListener(\u0027click\u0027, function (e) {\n    const el = e.target.closest(\u0027[data-route]\u0027);\n    if (!el) return;\n    const route = el.dataset.route;\n    if (!PAGES.includes(route)) return;\n    e.preventDefault();\n    // Service deep-link: prefill chip\n    if (el.dataset.service) {\n      window.__prefillService = el.dataset.service;\n    }\n    if (location.hash === \u0027#\u0027 + route) {\n      setActive(route);\n    } else {\n      location.hash = route;\n    }\n  });\n\n  window.addEventListener(\u0027hashchange\u0027, () =\u003e {\n    setActive(getRouteFromHash());\n    // Apply prefill after page swap\n    if (window.__prefillService) {\n      const target = window.__prefillService;\n      window.__prefillService = null;\n      setTimeout(() =\u003e {\n        document.querySelectorAll(\u0027.chip\u0027).forEach(c =\u003e {\n          c.classList.toggle(\u0027is-active\u0027, c.dataset.chip === target);\n        });\n      }, 50);\n    }\n  });\n\n  // Initial route\n  setActive(getRouteFromHash());\n\n  // Mobile toggle\n  toggle.addEventListener(\u0027click\u0027, () =\u003e {\n    drawer.classList.toggle(\u0027is-open\u0027);\n  });\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   PORTFOLIO FILTERS\n   ───────────────────────────────────────────────────────────── */\n(function () {\n  const filters = document.querySelectorAll(\u0027.filter\u0027);\n  const projects = document.querySelectorAll(\u0027.project\u0027);\n\n  filters.forEach(f =\u003e {\n    f.addEventListener(\u0027click\u0027, () =\u003e {\n      filters.forEach(x =\u003e x.classList.remove(\u0027is-active\u0027));\n      f.classList.add(\u0027is-active\u0027);\n      const cat = f.dataset.filter;\n      projects.forEach(p =\u003e {\n        const match = cat === \u0027all\u0027 || p.dataset.category === cat;\n        p.classList.toggle(\u0027is-hidden\u0027, !match);\n      });\n    });\n  });\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   CONTACT CHIPS (multi-select-ish; only one active)\n   ───────────────────────────────────────────────────────────── */\n(function () {\n  document.querySelectorAll(\u0027.chip\u0027).forEach(c =\u003e {\n    c.addEventListener(\u0027click\u0027, () =\u003e {\n      document.querySelectorAll(\u0027.chip\u0027).forEach(x =\u003e x.classList.remove(\u0027is-active\u0027));\n      c.classList.add(\u0027is-active\u0027);\n    });\n  });\n})();\n\n/* ─────────────────────────────────────────────────────────────\n   CONTACT FORM SUBMIT → SUCCESS STATE (no alerts)\n   ───────────────────────────────────────────────────────────── */\n(function () {\n  const form = document.getElementById(\u0027contact-form\u0027);\n  const again = document.getElementById(\u0027success-again\u0027);\n  if (!form || !again) return; // form removed, nothing to do\n  form.addEventListener(\u0027submit\u0027, (e) =\u003e {\n    e.preventDefault();\n    const email = document.getElementById(\u0027f-email\u0027);\n    if (!email.value || !email.value.includes(\u0027@\u0027)) {\n      email.focus();\n      email.style.borderColor = \u0027#FCACF5\u0027;\n      email.style.boxShadow = \u00270 0 0 4px rgba(252, 172, 245, 0.45)\u0027;\n      return;\n    }\n    form.classList.add(\u0027is-sent\u0027);\n  });\n  again.addEventListener(\u0027click\u0027, () =\u003e {\n    form.classList.remove(\u0027is-sent\u0027);\n    form.reset();\n    document.querySelectorAll(\u0027.chip\u0027).forEach(x =\u003e x.classList.remove(\u0027is-active\u0027));\n  });\n})();\n\u003c/script\u003e\n\n\u003c/body\u003e\u003c/html\u003e"
</script>
